events {
    worker_connections 1024;
}

http {
    server { 
        listen 80;
        server_name www.khalilktiri.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server { 
        listen 80;
        server_name www.fadom.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server { 
        listen 80;
        server_name cms.fadom.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

}