events {
    worker_connections 1024;
}

http {
    server { 
        listen 80;
        server_name www.khalilktiri.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server { 
        listen 80;
        server_name www.fadom.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server { 
        listen 80;
        server_name cms.fadom.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server { 
        listen 443 ssl;
        server_name www.khalilktiri.com;

        ssl_certificate /etc/letsencrypt/live/www.khalilktiri.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.khalilktiri.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://localhost:3023;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server { 
        listen 443 ssl;
        server_name www.fadom.app;
        
        client_max_body_size 100M;

        ssl_certificate /etc/letsencrypt/live/www.fadom.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.fadom.app/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://localhost:3024;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
    server { 
        listen 443 ssl;
        server_name cms.fadom.app;

        client_max_body_size 100M;
        

        ssl_certificate /etc/letsencrypt/live/www.fadom.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.fadom.app/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            proxy_pass http://localhost:1337;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 600;
            proxy_connect_timeout 600;
            proxy_send_timeout 600;

        }
    }
}